<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#111018"
    />

    <meta
      name="description"
      content="Upload a PvPoke rankings CSV and view every ranked Pokémon visually with sprites, names, forms, and rankings."
    />

    <meta
      name="keywords"
      content="PvPoke, Pokémon GO, PvP rankings, Pokémon rankings, Pokémon sprites, Great League, Ultra League, Master League"
    />

    <meta name="author" content="Aymen Shoteri" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Visual PvPoke Rankings"
    />

    <meta
      property="og:description"
      content="Turn PvPoke ranking CSV files into visual Pokémon rankings with sprites, names, forms, and positions."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="%PUBLIC_URL%/preview.png"
    />

    <!-- X / Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Visual PvPoke Rankings"
    />

    <meta
      name="twitter:description"
      content="Upload a PvPoke CSV and explore the rankings visually."
    />

    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/preview.png"
    />

    <!-- Icons -->
    <link
      rel="icon"
      href="./icon.webp"
    />

    <link
      rel="apple-touch-icon"
      href="./logo192.png"
    />

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <title>Visual PvPoke Rankings</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to use the Visual PvPoke
      Rankings tool.
    </noscript>

    <div id="root"></div>
  </body>
</html>
